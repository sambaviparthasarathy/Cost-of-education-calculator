<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cost of Education in India - Full Calculator</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root { --primary: #1a4fa0; --bg: #f6f8ff; --text: #1a1a2e; --border: #dde3f0; }
        body { font-family: system-ui, sans-serif; background-color: #fff; color: var(--text); margin: 0; padding: 20px; }
        .container { max-width: 900px; margin: 0 auto; }
        .header { text-align: center; margin-bottom: 30px; padding: 30px; background: var(--primary); color: white; border-radius: 12px; }
        .step { background: var(--bg); border: 1px solid var(--border); padding: 20px; border-radius: 12px; margin-bottom: 15px; }
        .step-title { font-weight: bold; font-size: 12px; text-transform: uppercase; color: var(--primary); margin-bottom: 10px; display: block; }
        select { width: 100%; padding: 12px; margin-top: 8px; border: 1px solid var(--border); border-radius: 8px; font-size: 16px; }
        .pill-row { display: flex; gap: 10px; margin-top: 10px; }
        .pill { padding: 10px 20px; border: 1px solid var(--border); background: white; border-radius: 20px; cursor: pointer; }
        .pill.active { background: var(--primary); color: white; }
        #results { display: none; margin-top: 30px; background: #1a1a2e; color: white; padding: 30px; border-radius: 15px; text-align: center; }
        .price { font-size: 48px; font-weight: 800; color: #7eb8f7; margin: 10px 0; }
        canvas { max-height: 250px; margin-top: 20px; background: white; border-radius: 8px; padding: 10px; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>India Education Cost Calculator</h1>
        <p>Complete 36 State Data (NSS 2025)</p>
    </div>

    <div class="step">
        <span class="step-title">1. Location</span>
        <select id="stateSelect" onchange="calculate()">
            <option value="all-India">🇮🇳 All-India Average</option>
        </select>
        <div class="pill-row">
            <button class="pill active" id="btnRural" onclick="setArea('Rural')">Rural</button>
            <button class="pill" id="btnUrban" onclick="setArea('Urban')">Urban</button>
        </div>
    </div>

    <div class="step">
        <span class="step-title">2. Schooling Details</span>
        <select id="levelSelect" onchange="calculate()">
            <option value="PRIMARY">Primary (Class 1-5)</option>
            <option value="MIDDLE">Middle (Class 6-8)</option>
            <option value="SECONDARY">Secondary (Class 9-10)</option>
            <option value="HIGHER SECONDARY">Higher Secondary (Class 11-12)</option>
        </select>
        <select id="typeSelect" onchange="calculate()">
            <option value="Government">Government School</option>
            <option value="Private unaided">Private School (Unaided)</option>
            <option value="Private aided">Government Aided School</option>
        </select>
    </div>

    <div id="results">
        <p>Estimated Annual Total Cost:</p>
        <div class="price" id="totalPrice">₹0</div>
        <div id="breakdown" style="font-size: 14px; opacity: 0.8;"></div>
        <canvas id="chart"></canvas>
    </div>
</div>

<script>
// ALL 36 STATES DATA
const DATA = {"Andhra Pradesh":{"Government":{"Rural":{"PRIMARY":1381,"MIDDLE":2439,"SECONDARY":2273,"HIGHER SECONDARY":6927},"Urban":{"PRIMARY":1675,"MIDDLE":4146,"SECONDARY":3200,"HIGHER SECONDARY":4809}},"Private unaided":{"Rural":{"PRIMARY":25431,"MIDDLE":33399,"SECONDARY":39782,"HIGHER SECONDARY":41525},"Urban":{"PRIMARY":30146,"MIDDLE":43798,"SECONDARY":47460,"HIGHER SECONDARY":23448}}},"Arunachal Pradesh":{"Government":{"Rural":{"PRIMARY":2874,"MIDDLE":5617,"SECONDARY":8443,"HIGHER SECONDARY":11411},"Urban":{"PRIMARY":5481,"MIDDLE":8397,"SECONDARY":8003,"HIGHER SECONDARY":7655}},"Private unaided":{"Rural":{"PRIMARY":77066,"MIDDLE":24715,"SECONDARY":54825,"HIGHER SECONDARY":116736}}},"Assam":{"Government":{"Rural":{"PRIMARY":3417,"MIDDLE":4145,"SECONDARY":4869,"HIGHER SECONDARY":12584}}},"Bihar":{"Government":{"Rural":{"PRIMARY":1691,"MIDDLE":2352,"SECONDARY":4079,"HIGHER SECONDARY":6524}}},"Chandigarh":{"Government":{"Urban":{"PRIMARY":3850,"MIDDLE":2836,"SECONDARY":9953,"HIGHER SECONDARY":12688}}},"Chhattisgarh":{"Government":{"Rural":{"PRIMARY":925,"MIDDLE":1759,"SECONDARY":3973,"HIGHER SECONDARY":5054}}},"Delhi":{"Government":{"Urban":{"PRIMARY":2976,"MIDDLE":3014,"SECONDARY":6641,"HIGHER SECONDARY":7323}}},"Goa":{"Government":{"Rural":{"PRIMARY":5049,"MIDDLE":4254,"SECONDARY":5566,"HIGHER SECONDARY":10048}}},"Gujarat":{"Government":{"Rural":{"PRIMARY":2001,"MIDDLE":2777,"SECONDARY":5532,"HIGHER SECONDARY":8404}}},"Haryana":{"Government":{"Rural":{"PRIMARY":2987,"MIDDLE":3761,"SECONDARY":6145,"HIGHER SECONDARY":7667}}},"Himachal Pradesh":{"Government":{"Rural":{"PRIMARY":2738,"MIDDLE":4254,"SECONDARY":5566,"HIGHER SECONDARY":10048}}},"Jammu & Kashmir":{"Government":{"Rural":{"PRIMARY":2530,"MIDDLE":3977,"SECONDARY":7385,"HIGHER SECONDARY":15317}}},"Jharkhand":{"Government":{"Rural":{"PRIMARY":842,"MIDDLE":1198,"SECONDARY":3305,"HIGHER SECONDARY":8051}}},"Karnataka":{"Government":{"Rural":{"PRIMARY":2225,"MIDDLE":3286,"SECONDARY":4438,"HIGHER SECONDARY":8502}}},"Kerala":{"Government":{"Rural":{"PRIMARY":6164,"MIDDLE":5710,"SECONDARY":6914,"HIGHER SECONDARY":9038}}},"Ladakh":{"Government":{"Rural":{"PRIMARY":1491,"MIDDLE":1448,"SECONDARY":2703,"HIGHER SECONDARY":8973}}},"Lakshadweep":{"Government":{"Rural":{"PRIMARY":1302,"MIDDLE":1743,"SECONDARY":1933,"HIGHER SECONDARY":1986}}},"Madhya Pradesh":{"Government":{"Rural":{"PRIMARY":1128,"MIDDLE":1980,"SECONDARY":4851,"HIGHER SECONDARY":6723}}},"Maharashtra":{"Government":{"Rural":{"PRIMARY":1719,"MIDDLE":3335,"SECONDARY":5904,"HIGHER SECONDARY":8187},"Urban":{"PRIMARY":2994,"MIDDLE":3901,"SECONDARY":3952,"HIGHER SECONDARY":3483}}},"Manipur":{"Government":{"Rural":{"PRIMARY":2401,"MIDDLE":2773,"SECONDARY":7836,"HIGHER SECONDARY":12161}}},"Meghalaya":{"Government":{"Rural":{"PRIMARY":3243,"MIDDLE":7137,"SECONDARY":13916,"HIGHER SECONDARY":23613}}},"Mizoram":{"Government":{"Rural":{"PRIMARY":2973,"MIDDLE":4026,"SECONDARY":4312,"HIGHER SECONDARY":6169}}},"Nagaland":{"Government":{"Rural":{"PRIMARY":3282,"MIDDLE":4224,"SECONDARY":6116,"HIGHER SECONDARY":11770}}},"Odisha":{"Government":{"Rural":{"PRIMARY":1183,"MIDDLE":1572,"SECONDARY":2687,"HIGHER SECONDARY":7546}}},"Puducherry":{"Government":{"Rural":{"PRIMARY":1199,"MIDDLE":2509,"SECONDARY":1784,"HIGHER SECONDARY":4022}}},"Punjab":{"Government":{"Rural":{"PRIMARY":2478,"MIDDLE":3348,"SECONDARY":6598,"HIGHER SECONDARY":7792}}},"Rajasthan":{"Government":{"Rural":{"PRIMARY":1448,"MIDDLE":1928,"SECONDARY":3634,"HIGHER SECONDARY":4328}}},"Sikkim":{"Government":{"Rural":{"PRIMARY":2667,"MIDDLE":5023,"SECONDARY":8741,"HIGHER SECONDARY":11834}}},"Tamil Nadu":{"Government":{"Rural":{"PRIMARY":1873,"MIDDLE":2786,"SECONDARY":4281,"HIGHER SECONDARY":4545}}},"Telangana":{"Government":{"Rural":{"PRIMARY":1619,"MIDDLE":2183,"SECONDARY":2744,"HIGHER SECONDARY":6076}}},"Tripura":{"Government":{"Rural":{"PRIMARY":4159,"MIDDLE":5822,"SECONDARY":6284,"HIGHER SECONDARY":9265}}},"Uttar Pradesh":{"Government":{"Rural":{"PRIMARY":1426,"MIDDLE":2146,"SECONDARY":5366,"HIGHER SECONDARY":7925}}},"Uttarakhand":{"Government":{"Rural":{"PRIMARY":1340,"MIDDLE":1420,"SECONDARY":3135,"HIGHER SECONDARY":4120}}},"West Bengal":{"Government":{"Rural":{"PRIMARY":1796,"MIDDLE":3755,"SECONDARY":4773,"HIGHER SECONDARY":6753}}},"all-India":{"Government":{"Rural":{"PRIMARY":1741,"MIDDLE":2584,"SECONDARY":4417,"HIGHER SECONDARY":7308},"Urban":{"PRIMARY":2935,"MIDDLE":3756,"SECONDARY":5683,"HIGHER SECONDARY":7704}},"Private unaided":{"Rural":{"PRIMARY":19794,"MIDDLE":24573,"SECONDARY":27461,"HIGHER SECONDARY":33567},"Urban":{"PRIMARY":31322,"MIDDLE":37845,"SECONDARY":44667,"HIGHER SECONDARY":49075}}}};

let area = 'Rural';
let chartObj = null;

function setArea(val) {
    area = val;
    document.getElementById('areaRural').classList.toggle('active', val==='Rural');
    document.getElementById('areaUrban').classList.toggle('active', val==='Urban');
    calculate();
}

function calculate() {
    const state = document.getElementById('stateSelect').value;
    const level = document.getElementById('levelSelect').value;
    const type = document.getElementById('typeSelect').value;

    const stateData = DATA[state] || DATA['all-India'];
    const typeData = stateData[type] || DATA['all-India'][type];
    const cost = typeData[area]?.[level] || typeData['Urban']?.[level] || 0;

    document.getElementById('totalPrice').innerText = "₹" + cost.toLocaleString('en-IN');
    document.getElementById('breakdown').innerText = `Annual out-of-pocket cost for ${level} in a ${type} school (${area}).`;
    document.getElementById('results').style.display = 'block';

    updateChart(cost);
}

function updateChart(val) {
    const ctx = document.getElementById('chart').getContext('2d');
    if (chartObj) chartObj.destroy();
    chartObj = new Chart(ctx, {
        type: 'bar',
        data: {
            labels: ['Selected', 'National Avg'],
            datasets: [{
                label: 'Annual Cost',
                data: [val, 13051],
                backgroundColor: ['#7eb8f7', '#1a4fa0']
            }]
        },
        options: { responsive: true, maintainAspectRatio: false }
    });
}

window.onload = function() {
    const sel = document.getElementById('stateSelect');
    Object.keys(DATA).sort().forEach(s => {
        if(s !== 'all-India') {
            let opt = document.createElement('option');
            opt.value = s; opt.innerText = s;
            sel.appendChild(opt);
        }
    });
    calculate();
};
</script>
</body>
</html>
