<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cost of Education in India — Calculator</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<style>
:root {
    --color-border-tertiary: #dde3f0;
    --color-background-primary: #ffffff;
    --color-background-secondary: #f6f8ff;
    --color-text-primary: #1a1a2e;
    --color-text-secondary: #3d3d5c;
    --color-text-tertiary: #7a7a9a;
    --border-radius-lg: 12px;
    --border-radius-md: 8px;
    --font-sans: system-ui, -apple-system, sans-serif;
}

/* RESET & BASE */
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font-sans);color:var(--color-text-primary);background:#fff;line-height:1.5}

/* HERO / PARALLAX (PEXELS IMAGES) */
.hero {
    position: relative; height: 80vh; min-height: 500px;
    display: flex; align-items: flex-end; overflow: hidden;
}
.hero-bg {
    position: absolute; inset: 0; 
    background-image: url('https://images.pexels.com/photos/5212345/pexels-photo-5212345.jpeg?auto=compress&cs=tinysrgb&w=1260&h=750&dpr=2');
    background-size: cover; background-position: center;
}
.hero-overlay {
    position: absolute; inset: 0;
    background: linear-gradient(to top, rgba(10,10,30,.85) 30%, rgba(10,10,30,0.2) 100%);
}
.hero-content { position: relative; z-index: 2; padding: 0 5vw 60px; max-width: 800px; color: #fff; }
.hero-title { font-size: clamp(32px, 5vw, 52px); font-weight: 800; margin-bottom: 16px; line-height: 1.1; }
.hero-title span { color: #7eb8f7; }

/* CALCULATOR STEPS (FROM V7) */
.page { max-width: 1100px; margin: 0 auto; padding: 40px 5vw; }
.step{border:.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-lg);margin-bottom:8px;background:var(--color-background-primary)}
.step-header{display:flex;align-items:center;gap:11px;padding:12px 15px;cursor:pointer;user-select:none}
.step-num{width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;background:var(--color-border-tertiary);color:var(--color-text-secondary)}
.step-num.done{background:#185FA5;color:#fff}
.step-title{font-size:13px;font-weight:500;flex:1}
.step-body{padding:0 15px 15px;display:none}
.step-body.open{display:block}

/* BUTTONS & INPUTS */
.opt-row{display:flex;flex-wrap:wrap;gap:7px}
.opt{padding:6px 13px;border-radius:20px;border:.5px solid var(--color-border-secondary);font-size:13px;cursor:pointer;background:#fff;transition:0.2s}
.opt.sel{background:#185FA5;color:#fff;border-color:#185FA5}
.lpill{padding:4px 10px;border-radius:14px;border:.5px solid var(--color-border-secondary);font-size:11px;cursor:pointer;margin:2px;display:inline-block;}
.lpill.sel{background:#185FA5;color:#fff}
.next-btn{margin-top:13px;padding:8px 20px;background:#185FA5;color:#fff;border:none;border-radius:20px;cursor:pointer}

/* RESULTS BOX */
.results{display:none;margin-top:20px}
.rcard{background:var(--color-background-secondary);border-radius:var(--border-radius-lg);padding:20px;margin-bottom:10px}
.mval{font-size:32px;font-weight:bold;color:#185FA5}
.chart-wrap{width:100%;height:350px;margin-top:20px}
</style>
</head>
<body>

<section class="hero">
    <div class="hero-bg"></div>
    <div class="hero-overlay"></div>
    <div class="hero-content">
        <p style="text-transform:uppercase; letter-spacing:2px; font-size:11px; margin-bottom:10px;">Education Data Analysis · 2025</p>
        <h1 class="hero-title">What does schooling<br>really cost in <span>India?</span></h1>
        <p>Calculate out-of-pocket expenses based on the latest NSS 80th Round and UDISE+ reports.</p>
    </div>
</section>

<div class="page">
    <div id="steps"></div>
    <div id="resultsBox" class="results"></div>
</div>

<script>
/* FULL DATASET */
const UDISE = {"Andhra Pradesh":{"Government":{"Rural":{"PRIMARY":1381,"MIDDLE":2439,"SECONDARY":2273,"HIGHER SECONDARY":6927},"Urban":{"PRIMARY":1675,"MIDDLE":4146,"SECONDARY":3200,"HIGHER SECONDARY":4809}},"Private unaided":{"Rural":{"PRIMARY":25431,"MIDDLE":33399,"SECONDARY":39782,"HIGHER SECONDARY":41525},"Urban":{"PRIMARY":30146,"MIDDLE":43798,"SECONDARY":47460,"HIGHER SECONDARY":23448}}},"Maharashtra":{"Government":{"Rural":{"PRIMARY":1719,"MIDDLE":3335,"SECONDARY":5904,"HIGHER SECONDARY":8187},"Urban":{"PRIMARY":2994,"MIDDLE":3901,"SECONDARY":3952,"HIGHER SECONDARY":3483}},"Private unaided":{"Rural":{"PRIMARY":24822,"MIDDLE":34348,"SECONDARY":28741,"HIGHER SECONDARY":31265},"Urban":{"PRIMARY":31711,"MIDDLE":38233,"SECONDARY":39789,"HIGHER SECONDARY":36736}}},"Delhi":{"Government":{"Urban":{"PRIMARY":2976,"MIDDLE":3014,"SECONDARY":6641,"HIGHER SECONDARY":7323}},"Private unaided":{"Urban":{"PRIMARY":42073,"MIDDLE":43457,"SECONDARY":63087,"HIGHER SECONDARY":71755}}},"all-India":{"Government":{"Rural":{"PRIMARY":1741,"MIDDLE":2584,"SECONDARY":4417,"HIGHER SECONDARY":7308},"Urban":{"PRIMARY":2935,"MIDDLE":3756,"SECONDARY":5683,"HIGHER SECONDARY":7704}},"Private unaided":{"Rural":{"PRIMARY":19794,"MIDDLE":24573,"SECONDARY":27461,"HIGHER SECONDARY":33567},"Urban":{"PRIMARY":31322,"MIDDLE":37845,"SECONDARY":44667,"HIGHER SECONDARY":49075}}}};
const COACHING_EXP = {"PRIMARY":{"all-India":1313},"MIDDLE":{"all-India":2189},"SECONDARY":{"all-India":4183},"HIGHER SECONDARY":{"all-India":6384}};
const SCHOOL_TYPE_ANNUAL = {"Andhra Pradesh":{"Government":{"rpu":2201},"Private unaided":{"rpu":32612}},"all-India":{"Government":{"rpu":3039},"Private unaided":{"rpu":28741}}};

const LEVELS = [
    {key: "PRIMARY", label: "Primary (1-5)"},
    {key: "MIDDLE", label: "Middle (6-8)"},
    {key: "SECONDARY", label: "Secondary (9-10)"},
    {key: "HIGHER SECONDARY", label: "Higher Secondary (11-12)"}
];

let S = { state: 'all-India', area: 'Urban', children: [{level: 'PRIMARY'}], schoolType: 'Government', coaching: 'no' };
let openStep = 0;
let myChart = null;

function render() {
    const wrap = document.getElementById("steps");
    wrap.innerHTML = `
        <div class="step">
            <div class="step-header" onclick="openStep=0; render()">
                <span class="step-num done">1</span>
                <span class="step-title">Select State & Area</span>
            </div>
            <div class="step-body ${openStep === 0 ? 'open' : ''}">
                <select onchange="S.state=this.value; render()" style="width:100%; padding:10px; margin-bottom:10px;">
                    <option value="all-India">All-India Average</option>
                    <option value="Andhra Pradesh" ${S.state === 'Andhra Pradesh' ? 'selected' : ''}>Andhra Pradesh</option>
                    <option value="Maharashtra" ${S.state === 'Maharashtra' ? 'selected' : ''}>Maharashtra</option>
                    <option value="Delhi" ${S.state === 'Delhi' ? 'selected' : ''}>Delhi</option>
                </select>
                <div class="opt-row">
                    <button class="opt ${S.area==='Rural'?'sel':''}" onclick="S.area='Rural'; render()">Rural</button>
                    <button class="opt ${S.area==='Urban'?'sel':''}" onclick="S.area='Urban'; render()">Urban</button>
                </div>
                <button class="next-btn" onclick="openStep=1; render()">Next</button>
            </div>
        </div>

        <div class="step">
            <div class="step-header" onclick="openStep=1; render()">
                <span class="step-num done">2</span>
                <span class="step-title">Education Level</span>
            </div>
            <div class="step-body ${openStep === 1 ? 'open' : ''}">
                <div class="opt-row">
                    ${LEVELS.map(l => `<button class="opt ${S.children[0].level === l.key ? 'sel' : ''}" onclick="S.children[0].level='${l.key}'; render()">${l.label}</button>`).join('')}
                </div>
                <button class="next-btn" onclick="openStep=2; render()">Next</button>
            </div>
        </div>

        <div class="step">
            <div class="step-header" onclick="openStep=2; render()">
                <span class="step-num done">3</span>
                <span class="step-title">School Type</span>
            </div>
            <div class="step-body ${openStep === 2 ? 'open' : ''}">
                <div class="opt-row">
                    <button class="opt ${S.schoolType==='Government'?'sel':''}" onclick="S.schoolType='Government'; render()">Government</button>
                    <button class="opt ${S.schoolType==='Private unaided'?'sel':''}" onclick="S.schoolType='Private unaided'; render()">Private</button>
                </div>
                <p style="margin: 15px 0 5px; font-weight: bold;">Coaching?</p>
                <div class="opt-row">
                    <button class="opt ${S.coaching==='yes'?'sel':''}" onclick="S.coaching='yes'; render()">Yes</button>
                    <button class="opt ${S.coaching==='no'?'sel':''}" onclick="S.coaching='no'; render()">No</button>
                </div>
            </div>
        </div>
    `;
    updateResults();
}

function updateResults() {
    const box = document.getElementById("resultsBox");
    box.style.display = "block";

    const stateData = UDISE[S.state] || UDISE['all-India'];
    const typeData = stateData[S.schoolType] || UDISE['all-India'][S.schoolType];
    const fee = typeData[S.area]?.[S.children[0].level] || typeData['Urban'][S.children[0].level] || 0;
    const coachFee = S.coaching === 'yes' ? COACHING_EXP[S.children[0].level]['all-India'] : 0;
    const total = fee + coachFee;

    box.innerHTML = `
        <div class="rcard">
            <p style="font-size:12px; color:var(--color-text-secondary); text-transform:uppercase;">Estimated Annual Total</p>
            <div class="mval">₹${total.toLocaleString('en-IN')}</div>
            <p style="font-size:13px; opacity:0.7; margin-top:5px;">School: ₹${fee.toLocaleString('en-IN')} | Coaching: ₹${coachFee.toLocaleString('en-IN')}</p>
        </div>
        <div class="rcard" style="background:#fff; height:300px;">
            <canvas id="mainChart"></canvas>
        </div>
    `;

    const ctx = document.getElementById('mainChart').getContext('2d');
    if (myChart) myChart.destroy();
    myChart = new Chart(ctx, {
        type: 'bar',
        data: {
            labels: ['Your Estimate', 'India Average'],
            datasets: [{
                label: 'Cost (₹)',
                data: [total, 13051],
                backgroundColor: ['#7eb8f7', '#1a4fa0']
            }]
        },
        options: { responsive: true, maintainAspectRatio: false }
    });
}

render();
</script>
</body>
</html>
